<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui chaque lettre adressée au maire attend une réponse écrite à la main ; demain l'agent IA écrit une première réponse appuyée sur le planning voté et la convention du club, l'agent municipal la relit et la met au parapheur, le maire signe, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">Chaque lettre,</text>
    <text class="t-h" x="20" y="73">une réponse à écrire.</text>
    <text class="t-clair surgit" style="--q:var(--c1-2)" x="20" y="160">Puis le parapheur,</text>
    <text class="t-clair surgit" style="--q:var(--c1-2);--r:.15s" x="20" y="174">pour la signature du maire</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA écrit</text>
    <text class="t-h" x="20" y="73">une première réponse.</text>
    <text class="t-l surgit" style="--q:var(--c2-3)" x="20" y="150"><tspan class="lab">Appui · </tspan>planning des salles</text>
    <text class="t-l surgit" style="--q:var(--c2-4)" x="20" y="166"><tspan class="lab">Appui · </tspan>convention</text>
    <g class="puce surgit" style="--q:var(--c2-1)">
      <rect x="20" y="178" width="70" height="20" rx="10"/>
      <text x="55" y="191.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-1)">
      <circle style="--r:0s" cx="98" cy="188" r="2"/>
      <circle style="--r:.4s" cx="98" cy="188" r="2"/>
      <circle style="--r:.8s" cx="98" cy="188" r="2"/>
    </g>
  </g>

  <!-- Les lettres recues, partagees par les scenes 1 et 2. -->
  <g class="z z-onde">
    <path class="env" style="--i:0" d="M20 98h40v28h-40z M20 98l20 15 20-15"/>
    <path class="env" style="--i:1" d="M70 98h40v28h-40z M70 98l20 15 20-15"/>
    <path class="env" style="--i:2" d="M120 98h40v28h-40z M120 98l20 15 20-15"/>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="112">La page blanche</text>
      <rect class="barre-x" x="18" y="60.5" width="116" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-2)">
      <circle cx="30" cy="100" r="10"/><path d="M25 100.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="105.5">Relire</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-2);--r:.3s" x="48" y="121">et ajuster</text>
    <text class="t-l surgit" style="--q:var(--c3-3)" x="20" y="146">→ Au parapheur</text>
    <g class="surgit" style="--q:var(--c3-4)">
      <rect class="k-filet" x="20" y="164" width="18" height="1.4"/>
      <text class="t-or" x="20" y="180">Une lettre cohérente</text>
      <text class="t-or" x="20" y="195">avec les décisions passées</text>
    </g>
  </g>

  <!-- IZAIA -->

  <!-- La reponse du maire, a droite. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <text class="t-pv" x="208" y="37">Réponse du maire</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>
    <rect class="caret" x="208" y="55" width="1.5" height="12"/>
    <rect class="manuel" style="--q:.40" x="208" y="59" width="70" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.72" x="208" y="69" width="40" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-1)" x="208" y="61">OBJET</text>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-2)" x="208" y="75">Créneau au gymnase</text>
    <rect class="barre doc-b" style="--q:var(--c2-2);--r:.2s" x="208" y="85" width="160" height="3" rx="1.5"/>
    <rect class="barre doc-b" style="--q:var(--c2-2);--r:.35s" x="208" y="94" width="130" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-3)" x="208" y="115">S'APPUIE SUR</text>
    <rect class="surl" style="--q:var(--c3-2)" x="205" y="119" width="130" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-3);--r:.15s" x="208" y="129">Le planning des salles</text>
    <g class="ok" style="--q:var(--c3-2);--r:.4s"><circle cx="368" cy="126" r="7"/><path d="M364.6 126.3l2.5 2.5 4.5-5"/></g>
    <rect class="surl" style="--q:var(--c3-2);--r:.5s" x="205" y="134" width="130" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-4)" x="208" y="144">La convention du club</text>
    <g class="ok" style="--q:var(--c3-2);--r:.9s"><circle cx="368" cy="141" r="7"/><path d="M364.6 141.3l2.5 2.5 4.5-5"/></g>
    <rect class="barre doc-b" style="--q:var(--c2-4);--r:.2s" x="208" y="155" width="110" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-4);--r:.3s" x="208" y="176">LE MAIRE</text>
    <rect class="filet" x="208" y="195" width="70" height="1"/>
    <g class="etq juste" style="--q:var(--c3-3)"><rect x="276" y="186" width="96" height="14" rx="7"/><text x="324" y="195.8" text-anchor="middle">AU PARAPHEUR</text></g>
    <g class="etq juste" style="--q:var(--c3-4)"><rect x="276" y="186" width="96" height="14" rx="7"/><text x="324" y="195.8" text-anchor="middle">SIGNÉE</text></g>
  </g>
</svg>
