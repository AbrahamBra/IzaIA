<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui chaque message de la messagerie d'accueil est ouvert à la main ; demain l'agent IA propose un service pour chaque demande, l'agent municipal valide ou en choisit un autre, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">On ouvre tout,</text>
    <text class="t-h" x="20" y="73">un par un.</text>
    <text class="t-clair" x="20" y="182">Chaque message, trié à la main</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA propose</text>
    <text class="t-h" x="20" y="73">un service.</text>
    <g class="puce surgit" style="--q:0">
      <rect x="20" y="170" width="70" height="20" rx="10"/>
      <text x="55" y="183.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-1)">
      <circle style="--r:0s" cx="98" cy="180" r="2"/>
      <circle style="--r:.4s" cx="98" cy="180" r="2"/>
      <circle style="--r:.8s" cx="98" cy="180" r="2"/>
    </g>
  </g>

  <g class="z z-onde">
    <path class="env" style="--i:0" d="M20 104h40v28h-40z M20 104l20 15 20-15"/>
    <path class="env" style="--i:1" d="M70 104h40v28h-40z M70 104l20 15 20-15"/>
    <path class="env" style="--i:2" d="M120 104h40v28h-40z M120 104l20 15 20-15"/>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="108">Trier à la main</text>
      <rect class="barre-x" x="18" y="60.5" width="112" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-2)">
      <circle cx="30" cy="110" r="10"/><path d="M25 110.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="115.5">Valider</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-3)" x="48" y="131">ou choisir un autre service</text>
    <g class="surgit" style="--q:var(--c3-4)">
      <rect class="k-filet" x="20" y="174" width="18" height="1.4"/>
      <text class="t-or" x="20" y="190">Du temps pour vos administrés</text>
    </g>
  </g>

  <!-- IZAIA -->

  <!-- La messagerie d'accueil, a droite : quatre demandes, puis leurs services. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <text class="t-pv" x="208" y="37">Messagerie d'accueil</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>

    <rect class="ouvre" style="--q:var(--c1-1);--r:0s" x="198" y="48" width="184" height="38"/>
    <circle class="pastille" cx="211" cy="62" r="2.6"/>
    <text class="t-doc t-fort" x="220" y="65.5">Permis de construire</text>
    <g class="etq doc-l" style="--q:var(--c2-2)"><rect x="220" y="71" width="58" height="13" rx="6.5"/><text x="249" y="80.3" text-anchor="middle">URBANISME</text></g>
    <g class="ok" style="--q:var(--c3-2);--r:.1s"><circle cx="368" cy="70" r="7"/><path d="M364.6 70.3l2.5 2.5 4.5-5"/></g>
    <rect class="filet" x="208" y="89" width="164" height="1"/>

    <rect class="ouvre" style="--q:var(--c1-1);--r:.75s" x="198" y="90" width="184" height="38"/>
    <circle class="pastille" cx="211" cy="100" r="2.6"/>
    <text class="t-doc t-fort" x="220" y="103.5">Nid-de-poule, rue des Lilas</text>
    <g class="etq doc-l" style="--q:var(--c2-3)"><rect x="220" y="109" width="42" height="13" rx="6.5"/><text x="241" y="118.3" text-anchor="middle">VOIRIE</text></g>
    <g class="ok" style="--q:var(--c3-2);--r:.35s"><circle cx="368" cy="108" r="7"/><path d="M364.6 108.3l2.5 2.5 4.5-5"/></g>
    <rect class="filet" x="208" y="127" width="164" height="1"/>

    <rect class="ouvre" style="--q:var(--c1-1);--r:1.5s" x="198" y="128" width="184" height="38"/>
    <circle class="pastille" cx="211" cy="138" r="2.6"/>
    <text class="t-doc t-fort" x="220" y="141.5">Inscription à la cantine</text>
    <g class="etq doc-l" style="--q:var(--c2-4)"><rect x="220" y="147" width="42" height="13" rx="6.5"/><text x="241" y="156.3" text-anchor="middle">ÉCOLES</text></g>
    <g class="ok" style="--q:var(--c3-2);--r:.6s"><circle cx="368" cy="146" r="7"/><path d="M364.6 146.3l2.5 2.5 4.5-5"/></g>
    <rect class="filet" x="208" y="165" width="164" height="1"/>

    <rect class="ouvre" style="--q:var(--c1-1);--r:2.25s" x="198" y="166" width="184" height="38"/>
    <circle class="pastille" cx="211" cy="176" r="2.6"/>
    <text class="t-doc t-fort" x="220" y="179.5">Lampadaire en panne</text>
    <g class="etq doc-l faux" style="--q:var(--c2-4);--r:.5s;--q3:var(--c3-3)"><rect x="220" y="185" width="58" height="13" rx="6.5"/><text x="249" y="194.3" text-anchor="middle">URBANISME</text></g>
    <g class="etq juste" style="--q:var(--c3-3);--r:.35s"><rect x="220" y="185" width="42" height="13" rx="6.5"/><text x="241" y="194.3" text-anchor="middle">VOIRIE</text></g>
    <g class="ok" style="--q:var(--c3-3);--r:.8s"><circle cx="368" cy="184" r="7"/><path d="M364.6 184.3l2.5 2.5 4.5-5"/></g>

    <rect class="balai" style="--q:var(--c2-1)" x="200" y="50" width="180" height="1.6"/>
  </g>
</svg>
