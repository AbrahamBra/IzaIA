<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui la séance est réécoutée pour écrire le procès-verbal ; demain l'agent IA prépare le projet, l'agent municipal le vérifie, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants --c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">On réécoute,</text>
    <text class="t-h" x="20" y="73">on retape.</text>
    <text class="t-clair" x="20" y="182">Réécoute, passage par passage</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA prépare</text>
    <text class="t-h" x="20" y="73">le projet.</text>
    <g class="puce surgit" style="--q:var(--c2-1)">
      <rect x="20" y="170" width="70" height="20" rx="10"/>
      <text x="55" y="183.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-1)">
      <circle style="--r:0s" cx="98" cy="180" r="2"/>
      <circle style="--r:.4s" cx="98" cy="180" r="2"/>
      <circle style="--r:.8s" cx="98" cy="180" r="2"/>
    </g>
  </g>

  <g class="z z-onde">
    <g class="onde" transform="translate(2 26)">
      <rect style="--i:0" x="18" y="92" width="4" height="16" rx="2"/>
      <rect style="--i:1" x="26" y="84" width="4" height="32" rx="2"/>
      <rect style="--i:2" x="34" y="76" width="4" height="48" rx="2"/>
      <rect style="--i:3" x="42" y="88" width="4" height="24" rx="2"/>
      <rect style="--i:4" x="50" y="72" width="4" height="56" rx="2"/>
      <rect style="--i:5" x="58" y="82" width="4" height="36" rx="2"/>
      <rect style="--i:6" x="66" y="90" width="4" height="20" rx="2"/>
      <rect style="--i:7" x="74" y="78" width="4" height="44" rx="2"/>
      <rect style="--i:8" x="82" y="86" width="4" height="28" rx="2"/>
      <rect style="--i:9" x="90" y="74" width="4" height="52" rx="2"/>
      <rect style="--i:10" x="98" y="88" width="4" height="24" rx="2"/>
      <rect style="--i:11" x="106" y="80" width="4" height="40" rx="2"/>
      <rect style="--i:12" x="114" y="92" width="4" height="16" rx="2"/>
      <rect style="--i:13" x="122" y="76" width="4" height="48" rx="2"/>
      <rect style="--i:14" x="130" y="84" width="4" height="32" rx="2"/>
      <rect style="--i:15" x="138" y="90" width="4" height="20" rx="2"/>
      <rect style="--i:16" x="146" y="78" width="4" height="44" rx="2"/>
      <rect style="--i:17" x="154" y="86" width="4" height="28" rx="2"/>
      <rect style="--i:18" x="162" y="82" width="4" height="36" rx="2"/>
      <rect style="--i:19" x="170" y="92" width="4" height="16" rx="2"/>
      <rect class="tete" x="17" y="66" width="2" height="68" rx="1"/>
    </g>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="104">Tout réécouter</text>
      <rect class="barre-x" x="18" y="60.5" width="108" height="1.6"/>
    </g>
    <g class="rang-x" style="--q:var(--c3-2)">
      <text class="t-h" x="20" y="90" textLength="88">Tout retaper</text>
      <rect class="barre-x" x="18" y="84.5" width="92" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-3)">
      <circle cx="30" cy="132" r="10"/><path d="M25 132.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="137.5">Vérifier</text>
      <text class="t-clair" x="48" y="153">votes, noms, chiffres clés</text>
    </g>
    <g class="surgit" style="--q:var(--c3-7)">
      <rect class="k-filet" x="20" y="174" width="18" height="1.4"/>
      <text class="t-or" x="20" y="190">Du temps pour vos administrés</text>
    </g>
  </g>

  <g class="z z-4">
    <g class="marque surgit" style="--q:0">
      <path class="m1" d="M20 40 L30.5 27 L41 40"/>
      <path class="m2" d="M24.5 40 L35 27 L45.5 40"/>
      <text class="t-marque" x="54" y="41">IZA<tspan class="ia">IA</tspan><tspan class="pt">.</tspan></text>
    </g>
    <text class="t-h grand surgit" style="--q:var(--c4-1)" x="20" y="82">Vous aider à choisir.</text>
    <g class="surgit" style="--q:var(--c4-2)">
      <circle class="num" cx="29" cy="113" r="9"/><text class="t-num" x="29" y="116.8" text-anchor="middle">1</text>
      <text class="t-l" x="48" y="117">Regarder d'abord ce qui existe déjà</text>
    </g>
    <g class="surgit" style="--q:var(--c4-3)">
      <circle class="num" cx="29" cy="143" r="9"/><text class="t-num" x="29" y="146.8" text-anchor="middle">2</text>
      <text class="t-l" x="48" y="147">Construire seulement s'il le faut</text>
    </g>
    <g class="surgit" style="--q:var(--c4-4)">
      <circle class="num" cx="29" cy="173" r="9"/><text class="t-num" x="29" y="176.8" text-anchor="middle">3</text>
      <text class="t-l" x="48" y="177">Vous dire quand il n'y a rien à construire</text>
    </g>
  </g>

  <!-- Le proces-verbal, a droite : vide, puis rempli, puis relu, puis rangé. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <text class="t-pv" x="208" y="37">Procès-verbal</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>
    <rect class="caret" x="208" y="55" width="1.5" height="12"/>
    <rect class="manuel" style="--q:.30" x="208" y="59" width="72" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.66" x="208" y="69" width="44" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-2);--r:0s" x="208" y="61">ORDRE DU JOUR</text>
    <rect class="surl" style="--q:var(--c3-6)" x="270" y="66" width="50" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-3)" x="208" y="76">Subvention : <tspan class="chiffre">12 400 €</tspan></text>
    <rect class="rature" style="--q:var(--c3-6);--r:.45s" x="270" y="72" width="46" height="1.4"/>
    <text class="t-doc corrige" style="--q:var(--c3-6);--r:.75s" x="325" y="76">14 200 €</text>
    <rect class="barre doc-b" style="--q:var(--c2-3);--r:.2s" x="208" y="84" width="150" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-2);--r:.12s" x="208" y="105">INTERVENTIONS</text>
    <rect class="surl" style="--q:var(--c3-5)" x="205" y="110" width="66" height="14" rx="2"/>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-4)" x="208" y="120">Mme Martin</text>
    <rect class="barre doc-b" style="--q:var(--c2-4);--r:.1s" x="278" y="115" width="94" height="3" rx="1.5"/>
    <rect class="barre doc-b" style="--q:var(--c2-4);--r:.3s" x="208" y="129" width="164" height="3" rx="1.5"/>
    <rect class="barre doc-b" style="--q:var(--c2-4);--r:.5s" x="208" y="138" width="120" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-2);--r:.24s" x="208" y="159">VOTES</text>
    <rect class="surl" style="--q:var(--c3-4)" x="205" y="164" width="106" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-5)" x="208" y="174">Pour 17 · Contre 4</text>
    <rect class="barre doc-b" style="--q:var(--c2-5);--r:.2s" x="208" y="183" width="96" height="3" rx="1.5"/>
  </g>
</svg>
