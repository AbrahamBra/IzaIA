<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui une même information est réécrite pour le site, les réseaux sociaux, l'application et l'affichage ; demain l'agent IA écrit, à partir d'une seule note sur la collecte des encombrants du 8 avril, un article, un message court et une affiche, l'agent municipal vérifie la date, les rues et les objets acceptés, puis publie, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">Une information,</text>
    <text class="t-h" x="20" y="73">réécrite partout.</text>
    <!-- Quatre supports : le site, les reseaux, l'application, le panneau. -->
    <g class="surgit" style="--q:var(--c1-1)">
      <rect class="trait fond" x="20" y="100" width="30" height="24" rx="2"/>
      <rect class="trait-l" x="20" y="100" width="30" height="5"/>
      <text class="t-clair" x="35" y="140" text-anchor="middle">Site</text>
    </g>
    <g class="surgit" style="--q:var(--c1-2)">
      <path class="trait fond" d="M62 100h30a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3h-20l-7 6v-6h-3a3 3 0 0 1-3-3v-14a3 3 0 0 1 3-3z"/>
      <text class="t-clair" x="77" y="140" text-anchor="middle">Réseaux</text>
    </g>
    <g class="surgit" style="--q:var(--c1-3)">
      <rect class="trait fond" x="110" y="96" width="18" height="30" rx="3"/>
      <rect class="trait-l" x="115" y="121" width="8" height="1.6" rx=".8"/>
      <text class="t-clair" x="119" y="140" text-anchor="middle">Appli</text>
    </g>
    <g class="surgit" style="--q:var(--c1-4)">
      <rect class="trait fond" x="146" y="98" width="30" height="20" rx="1.5"/>
      <path class="trait" d="M161 118v10"/>
      <text class="t-clair" x="161" y="140" text-anchor="middle">Affichage</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c1-5)" x="20" y="178">Chaque fois, tout réécrire</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA écrit</text>
    <text class="t-h" x="20" y="73">pour chaque support.</text>
    <g class="surgit" style="--q:var(--c2-1)">
      <path class="trait fond" style="stroke:var(--gold-strong)" d="M20 96h28l8 8v40h-36z"/>
      <rect class="trait-l" style="fill:var(--gold-strong)" x="26" y="112" width="24" height="1.6"/>
      <rect class="trait-l" style="fill:var(--gold-strong)" x="26" y="120" width="24" height="1.6"/>
      <rect class="trait-l" style="fill:var(--gold-strong)" x="26" y="128" width="16" height="1.6"/>
      <text class="t-l" x="66" y="124"><tspan class="lab">Une seule </tspan>note</text>
    </g>
    <g class="puce surgit" style="--q:var(--c2-1);--r:.3s">
      <rect x="20" y="178" width="70" height="20" rx="10"/>
      <text x="55" y="191.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-1)">
      <circle style="--r:.3s" cx="98" cy="188" r="2"/>
      <circle style="--r:.7s" cx="98" cy="188" r="2"/>
      <circle style="--r:1.1s" cx="98" cy="188" r="2"/>
    </g>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="108">Tout reformuler</text>
      <rect class="barre-x" x="18" y="60.5" width="112" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-2)">
      <circle cx="30" cy="100" r="10"/><path d="M25 100.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="105.5">Vérifier</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-3)" x="48" y="121">la date, les rues, les objets</text>
    <text class="t-l surgit" style="--q:var(--c3-5)" x="20" y="146">→ Publier</text>
    <g class="surgit" style="--q:var(--c3-6)">
      <rect class="k-filet" x="20" y="164" width="18" height="1.4"/>
      <text class="t-or" x="20" y="180">La même date,</text>
      <text class="t-or" x="20" y="195">sur l'affiche et le téléphone</text>
    </g>
  </g>

  <!-- IZAIA -->

  <!-- La note, puis ses trois versions, a droite. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <rect class="caret" x="208" y="27" width="1.5" height="12"/>
    <rect class="manuel" style="--q:.35" x="208" y="31" width="120" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.55" x="208" y="60" width="90" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.75" x="208" y="74" width="110" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.9" x="208" y="88" width="70" height="3" rx="1.5"/>
    <text class="t-pv doc-l" style="--q:var(--c2-1)" x="208" y="37">Collecte des encombrants</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>

    <rect class="surl" style="--q:var(--c3-2)" x="205" y="52" width="138" height="13" rx="2"/>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-2)" x="208" y="62">Le 8 avril</text>
    <g class="ok" style="--q:var(--c3-2);--r:.3s"><circle cx="368" cy="58" r="7"/><path d="M364.6 58.3l2.5 2.5 4.5-5"/></g>
    <rect class="surl" style="--q:var(--c3-3)" x="205" y="66" width="138" height="13" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-2);--r:.2s" x="208" y="76">Les rues concernées</text>
    <g class="ok" style="--q:var(--c3-3);--r:.3s"><circle cx="368" cy="72" r="7"/><path d="M364.6 72.3l2.5 2.5 4.5-5"/></g>
    <rect class="surl" style="--q:var(--c3-4)" x="205" y="80" width="138" height="13" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-2);--r:.4s" x="208" y="90">Les objets acceptés</text>
    <g class="ok" style="--q:var(--c3-4);--r:.3s"><circle cx="368" cy="86" r="7"/><path d="M364.6 86.3l2.5 2.5 4.5-5"/></g>
    <rect class="filet" x="208" y="99" width="164" height="1"/>

    <text class="t-rub doc-l" style="--q:var(--c2-3)" x="208" y="114">ARTICLE POUR LE SITE</text>
    <rect class="barre doc-b" style="--q:var(--c2-3);--r:.2s" x="208" y="120" width="160" height="3" rx="1.5"/>
    <rect class="barre doc-b" style="--q:var(--c2-3);--r:.35s" x="208" y="127" width="130" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-4)" x="208" y="146">MESSAGE COURT</text>
    <rect class="barre doc-b" style="--q:var(--c2-4);--r:.2s" x="208" y="152" width="96" height="3" rx="1.5"/>

    <g class="etq doc-l" style="--q:var(--c2-5)">
      <rect x="208" y="164" width="78" height="38" rx="3"/>
      <text x="247" y="179" text-anchor="middle">ENCOMBRANTS</text>
      <text x="247" y="193" text-anchor="middle" style="fill:var(--gold-strong);font-size:9px">LE 8 AVRIL</text>
    </g>
    <g class="etq juste" style="--q:var(--c3-5)"><rect x="296" y="186" width="76" height="14" rx="7"/><text x="334" y="195.8" text-anchor="middle">PUBLIÉE</text></g>
  </g>
</svg>
