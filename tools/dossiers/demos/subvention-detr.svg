<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui chaque règlement de financeur est relu ligne à ligne ; demain l'agent IA lit l'appel à projets de la préfecture pour la dotation d'équipement des territoires ruraux, relève les conditions, les pièces et la date limite pour la mise en accessibilité de la mairie, l'agent municipal vérifie chaque condition et prépare le plan de financement adopté par le conseil, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">Un règlement</text>
    <text class="t-h" x="20" y="73">à relire en entier.</text>
    <text class="t-clair surgit" style="--q:var(--c1-1)" x="42" y="160" text-anchor="middle">Préfecture</text>
    <text class="t-clair surgit" style="--q:var(--c1-1);--r:.2s" x="94" y="160" text-anchor="middle">Région</text>
    <text class="t-clair surgit" style="--q:var(--c1-1);--r:.4s" x="146" y="160" text-anchor="middle">Département</text>
    <text class="t-clair surgit" style="--q:var(--c1-2)" x="20" y="186">Relu ligne à ligne</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA lit</text>
    <text class="t-h" x="20" y="73">le règlement.</text>
    <text class="t-l surgit" style="--q:var(--c2-1)" x="20" y="162"><tspan class="lab">DETR · </tspan>préfecture</text>
    <g class="puce surgit" style="--q:var(--c2-1);--r:.2s">
      <rect x="20" y="178" width="70" height="20" rx="10"/>
      <text x="55" y="191.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-1)">
      <circle style="--r:.2s" cx="98" cy="188" r="2"/>
      <circle style="--r:.6s" cx="98" cy="188" r="2"/>
      <circle style="--r:1s" cx="98" cy="188" r="2"/>
    </g>
  </g>

  <!-- Trois reglements, partages par les scenes 1 et 2. -->
  <g class="z z-onde">
    <path class="trait fond" d="M20 94h32l8 8v44h-40z"/>
    <rect class="trait-l" x="26" y="110" width="28" height="1.6"/>
    <rect class="trait-l" x="26" y="118" width="28" height="1.6"/>
    <rect class="trait-l" x="26" y="126" width="20" height="1.6"/>
    <path class="trait fond" d="M72 94h32l8 8v44h-40z"/>
    <rect class="trait-l" x="78" y="110" width="28" height="1.6"/>
    <rect class="trait-l" x="78" y="118" width="28" height="1.6"/>
    <rect class="trait-l" x="78" y="126" width="20" height="1.6"/>
    <path class="trait fond" d="M124 94h32l8 8v44h-40z"/>
    <rect class="trait-l" x="130" y="110" width="28" height="1.6"/>
    <rect class="trait-l" x="130" y="118" width="28" height="1.6"/>
    <rect class="trait-l" x="130" y="126" width="20" height="1.6"/>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="115">Dresser la liste</text>
      <rect class="barre-x" x="18" y="60.5" width="119" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-2)">
      <circle cx="30" cy="96" r="10"/><path d="M25 96.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="101.5">Vérifier</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-2);--r:.3s" x="48" y="117">chaque condition</text>
    <text class="t-l surgit" style="--q:var(--c3-3)" x="20" y="140">→ Plan de financement</text>
    <text class="t-clair surgit" style="--q:var(--c3-4)" x="20" y="154">adopté par le conseil municipal</text>
    <g class="surgit" style="--q:var(--c3-5)">
      <rect class="k-filet" x="20" y="166" width="18" height="1.4"/>
      <text class="t-or" x="20" y="182">Un dossier complet,</text>
      <text class="t-or" x="20" y="197">avant la date limite</text>
    </g>
  </g>

  <!-- IZAIA -->

  <!-- Le dossier, a droite. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <text class="t-pv" x="208" y="37">Dossier de subvention</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>
    <rect class="caret" x="208" y="55" width="1.5" height="12"/>
    <rect class="manuel" style="--q:.35" x="208" y="59" width="120" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.6" x="208" y="69" width="80" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-1)" x="208" y="61">APPEL À PROJETS DETR</text>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-2)" x="208" y="75">Accessibilité de la mairie</text>

    <text class="t-rub doc-l" style="--q:var(--c2-3)" x="208" y="95">CONDITIONS</text>
    <rect class="surl" style="--q:var(--c3-2)" x="205" y="99" width="138" height="13" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-3);--r:.15s" x="208" y="109">Commune éligible</text>
    <g class="ok" style="--q:var(--c3-2);--r:.4s"><circle cx="368" cy="105" r="7"/><path d="M364.6 105.3l2.5 2.5 4.5-5"/></g>
    <rect class="surl" style="--q:var(--c3-2);--r:.5s" x="205" y="113" width="138" height="13" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-3);--r:.3s" x="208" y="123">Travaux non commencés</text>
    <g class="ok" style="--q:var(--c3-2);--r:.9s"><circle cx="368" cy="119" r="7"/><path d="M364.6 119.3l2.5 2.5 4.5-5"/></g>

    <text class="t-rub doc-l" style="--q:var(--c2-4)" x="208" y="142">PIÈCES À JOINDRE</text>
    <rect class="surl" style="--q:var(--c3-2);--r:1s" x="205" y="146" width="138" height="13" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-4);--r:.15s" x="208" y="156">Devis, plans, calendrier</text>
    <g class="ok" style="--q:var(--c3-2);--r:1.4s"><circle cx="368" cy="152" r="7"/><path d="M364.6 152.3l2.5 2.5 4.5-5"/></g>

    <text class="t-rub doc-l" style="--q:var(--c2-5)" x="208" y="175">DATE LIMITE</text>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-5);--r:.15s" x="276" y="175.5">15 janvier</text>
    <g class="ok" style="--q:var(--c3-2);--r:1.9s"><circle cx="368" cy="172" r="7"/><path d="M364.6 172.3l2.5 2.5 4.5-5"/></g>

    <rect class="barre doc-b" style="--q:var(--c2-6)" x="208" y="188" width="56" height="3" rx="1.5"/>
    <rect class="barre doc-b" style="--q:var(--c2-6);--r:.15s" x="208" y="196" width="40" height="3" rx="1.5"/>
    <g class="etq juste" style="--q:var(--c3-5)"><rect x="276" y="186" width="96" height="14" rx="7"/><text x="324" y="195.8" text-anchor="middle">DOSSIER COMPLET</text></g>
  </g>
</svg>
