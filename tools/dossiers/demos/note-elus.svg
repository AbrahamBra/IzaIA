<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui les rapports des services sont résumés pour les élus dans l'urgence ; demain l'agent IA prépare une note courte par rapport, l'agent municipal la relit avec le rapport d'origine, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">On résume tout,</text>
    <text class="t-h" x="20" y="73">dans l'urgence.</text>
    <text class="t-clair surgit" style="--q:var(--c1-2)" x="20" y="190">Souvent au dernier moment</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA prépare</text>
    <text class="t-h" x="20" y="73">une note courte.</text>
    <g class="puce surgit" style="--q:var(--c2-1)">
      <rect x="20" y="172" width="70" height="20" rx="10"/>
      <text x="55" y="185.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-1)">
      <circle style="--r:0s" cx="98" cy="182" r="2"/>
      <circle style="--r:.4s" cx="98" cy="182" r="2"/>
      <circle style="--r:.8s" cx="98" cy="182" r="2"/>
    </g>
  </g>

  <!-- La pile de rapports, partagee par les scenes 1 et 2. -->
  <g class="z z-onde">
    <rect class="trait fond" x="36" y="100" width="92" height="56" rx="4"/>
    <rect class="trait fond" x="28" y="94" width="92" height="56" rx="4"/>
    <rect class="trait fond" x="20" y="88" width="92" height="56" rx="4"/>
    <text class="t-l" x="30" y="108">Rapport</text>
    <text class="t-clair" x="30" y="122">Éclairage public · 36 p.</text>
    <rect class="trait-l" x="30" y="130" width="66" height="2.4" rx="1.2"/>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="156">Résumer dans l'urgence</text>
      <rect class="barre-x" x="18" y="60.5" width="160" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-2)">
      <circle cx="30" cy="100" r="10"/><path d="M25 100.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="105.5">Relire</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-3)" x="48" y="121">avec le rapport d'origine</text>
    <g class="surgit" style="--q:var(--c3-5)">
      <rect class="k-filet" x="20" y="160" width="18" height="1.4"/>
      <text class="t-or" x="20" y="176">Des élus qui savent</text>
      <text class="t-or" x="20" y="191">sur quoi ils votent</text>
    </g>
  </g>

  <!-- IZAIA -->

  <!-- La note pour les elus, a droite. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <text class="t-pv" x="208" y="37">Note aux élus</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>
    <rect class="caret" x="208" y="55" width="1.5" height="12"/>
    <rect class="manuel" style="--q:.45" x="208" y="59" width="60" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-2)" x="208" y="61">OBJET</text>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-3)" x="208" y="75">Éclairage public</text>
    <g class="ok" style="--q:var(--c3-4);--r:.9s"><circle cx="368" cy="72" r="7"/><path d="M364.6 72.3l2.5 2.5 4.5-5"/></g>
    <rect class="barre doc-b" style="--q:var(--c2-3);--r:.15s" x="208" y="83" width="140" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-2);--r:.12s" x="208" y="104">MONTANT</text>
    <rect class="surl" style="--q:var(--c3-3)" x="205" y="108" width="58" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-4)" x="208" y="118">126 000 €</text>
    <g class="ok" style="--q:var(--c3-4);--r:.7s"><circle cx="368" cy="115" r="7"/><path d="M364.6 115.3l2.5 2.5 4.5-5"/></g>
    <g class="etq juste" style="--q:var(--c3-3);--r:.2s"><rect x="300" y="88" width="62" height="13" rx="6.5"/><text x="331" y="97.3" text-anchor="middle">RAPPORT P. 12</text></g>

    <text class="t-rub doc-l" style="--q:var(--c2-2);--r:.24s" x="208" y="147">DÉCISION DEMANDÉE</text>
    <text class="t-doc doc-l" style="--q:var(--c2-5)" x="208" y="161">Approuver le financement</text>
    <g class="ok" style="--q:var(--c3-4);--r:1.1s"><circle cx="368" cy="158" r="7"/><path d="M364.6 158.3l2.5 2.5 4.5-5"/></g>
    <rect class="barre doc-b" style="--q:var(--c2-5);--r:.15s" x="208" y="169" width="150" height="3" rx="1.5"/>
    <rect class="barre doc-b" style="--q:var(--c2-5);--r:.3s" x="208" y="178" width="96" height="3" rx="1.5"/>
  </g>
</svg>
