<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui le cahier des charges de l'ancien marché est relu en entier ; demain l'agent IA prépare une première trame pour l'entretien des espaces verts, avec les clauses encore valables, sans jamais lire les offres, l'agent municipal définit le besoin et les critères puis complète la trame, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">Repartir</text>
    <text class="t-h" x="20" y="73">de l'ancien marché.</text>
    <text class="t-clair surgit" style="--q:var(--c1-1)" x="20" y="162">L'ancien cahier des charges,</text>
    <text class="t-clair surgit" style="--q:var(--c1-2)" x="20" y="176">relu en entier</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA prépare</text>
    <text class="t-h" x="20" y="73">une première trame.</text>
    <text class="t-l surgit" style="--q:var(--c2-2)" x="20" y="156"><tspan class="lab">Besoin · </tspan>espaces verts</text>
    <text class="t-clair surgit" style="--q:var(--c2-7)" x="20" y="170">Il ne lit pas les offres.</text>
    <g class="puce surgit" style="--q:var(--c2-1)">
      <rect x="20" y="178" width="70" height="20" rx="10"/>
      <text x="55" y="191.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-1)">
      <circle style="--r:0s" cx="98" cy="188" r="2"/>
      <circle style="--r:.4s" cx="98" cy="188" r="2"/>
      <circle style="--r:.8s" cx="98" cy="188" r="2"/>
    </g>
  </g>

  <!-- L'ancien marche, une liasse, partagee par les scenes 1 et 2. -->
  <g class="z z-onde">
    <rect class="trait fond" x="32" y="84" width="44" height="46" rx="2"/>
    <rect class="trait fond" x="26" y="88" width="44" height="46" rx="2"/>
    <rect class="trait fond" x="20" y="92" width="44" height="46" rx="2"/>
    <rect class="trait-l" x="26" y="102" width="32" height="1.6"/>
    <rect class="trait-l" x="26" y="110" width="32" height="1.6"/>
    <rect class="trait-l" x="26" y="118" width="32" height="1.6"/>
    <rect class="trait-l" x="26" y="126" width="20" height="1.6"/>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="80">Tout relire</text>
      <rect class="barre-x" x="18" y="60.5" width="84" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-2)">
      <circle cx="30" cy="96" r="10"/><path d="M25 96.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="101.5">Définir</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-3)" x="48" y="117">le besoin et les critères</text>
    <text class="t-l surgit" style="--q:var(--c3-4)" x="20" y="138">→ Compléter la trame</text>
    <g class="surgit" style="--q:var(--c3-5)">
      <rect class="k-filet" x="20" y="150" width="18" height="1.4"/>
      <text class="t-or" x="20" y="166">Le besoin actuel</text>
      <text class="t-or" x="20" y="181">de la commune</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-6)" x="20" y="198">La commune choisit l'entreprise</text>
  </g>

  <!-- IZAIA -->

  <!-- La trame, a droite. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <text class="t-pv" x="208" y="37">Cahier des charges</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>
    <rect class="caret" x="208" y="55" width="1.5" height="12"/>
    <rect class="manuel" style="--q:.30" x="208" y="59" width="120" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.55" x="208" y="69" width="90" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.80" x="208" y="79" width="60" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-1)" x="208" y="61">OBJET</text>
    <rect class="surl" style="--q:var(--c3-2)" x="205" y="65" width="152" height="28" rx="2"/>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-2)" x="208" y="75">Entretien des espaces verts</text>
    <text class="t-doc doc-l" style="--q:var(--c2-2);--r:.2s" x="208" y="89">Durée : trois ans</text>
    <g class="ok" style="--q:var(--c3-2);--r:.4s"><circle cx="368" cy="79" r="7"/><path d="M364.6 79.3l2.5 2.5 4.5-5"/></g>

    <text class="t-rub doc-l" style="--q:var(--c2-3)" x="208" y="109">PRESTATIONS</text>
    <rect class="surl" style="--q:var(--c3-3)" x="205" y="113" width="152" height="28" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-3);--r:.15s" x="208" y="123">Tonte</text>
    <text class="t-doc doc-l" style="--q:var(--c2-4)" x="208" y="137">Taille des haies</text>
    <g class="ok" style="--q:var(--c3-3);--r:.4s"><circle cx="368" cy="127" r="7"/><path d="M364.6 127.3l2.5 2.5 4.5-5"/></g>

    <text class="t-rub doc-l" style="--q:var(--c2-6)" x="208" y="157">CLAUSES ENCORE VALABLES</text>
    <rect class="barre doc-b" style="--q:var(--c2-6);--r:.2s" x="208" y="163" width="150" height="3" rx="1.5"/>
    <rect class="barre doc-b" style="--q:var(--c2-6);--r:.35s" x="208" y="171" width="110" height="3" rx="1.5"/>

    <g class="etq juste" style="--q:var(--c3-4)"><rect x="286" y="186" width="86" height="14" rx="7"/><text x="329" y="195.8" text-anchor="middle">COMPLÉTÉE</text></g>
  </g>
</svg>
