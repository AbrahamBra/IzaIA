<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui les mêmes arrêtés reviennent sans cesse ; demain l'agent IA prépare l'arrêté à partir de la demande reçue et du modèle de la collectivité, l'agent municipal vérifie les dates, les lieux et le fondement juridique avant la signature, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">Les mêmes arrêtés,</text>
    <text class="t-h" x="20" y="73">encore et encore.</text>
    <g class="surgit" style="--q:var(--c1-1)"><rect class="trait" x="20" y="92" width="96" height="20" rx="10"/><text class="t-l" x="68" y="106" text-anchor="middle">Circulation</text></g>
    <g class="surgit" style="--q:var(--c1-2)"><rect class="trait" x="20" y="118" width="120" height="20" rx="10"/><text class="t-l" x="80" y="132" text-anchor="middle">Domaine public</text></g>
    <g class="surgit" style="--q:var(--c1-3)"><rect class="trait" x="20" y="144" width="72" height="20" rx="10"/><text class="t-l" x="56" y="158" text-anchor="middle">Voirie</text></g>
    <text class="t-or surgit" style="--q:var(--c1-4)" x="20" y="190">Aucune mention ne doit manquer</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA prépare</text>
    <text class="t-h" x="20" y="73">l'arrêté.</text>
    <g class="surgit" style="--q:var(--c2-1)">
      <text class="t-clair" x="20" y="96">La demande reçue</text>
      <text class="t-l" x="20" y="114">Travaux, avenue de la Gare</text>
      <text class="t-l" x="20" y="131">Du 12 au 16 mai</text>
    </g>
    <text class="t-or surgit" style="--q:var(--c2-2)" x="20" y="154">+ votre modèle d'arrêté</text>
    <g class="puce surgit" style="--q:var(--c2-3)">
      <rect x="20" y="172" width="70" height="20" rx="10"/>
      <text x="55" y="185.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-3)">
      <circle style="--r:0s" cx="98" cy="182" r="2"/>
      <circle style="--r:.4s" cx="98" cy="182" r="2"/>
      <circle style="--r:.8s" cx="98" cy="182" r="2"/>
    </g>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="130">Adapter l'ancien</text>
      <rect class="barre-x" x="18" y="60.5" width="134" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-2)">
      <circle cx="30" cy="100" r="10"/><path d="M25 100.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="105.5">Vérifier</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-2);--r:.3s" x="48" y="121">dates, lieux, fondement</text>
    <text class="t-l surgit" style="--q:var(--c3-5)" x="20" y="148">→ Présenté à la signature</text>
    <g class="surgit" style="--q:var(--c3-6)">
      <rect class="k-filet" x="20" y="174" width="18" height="1.4"/>
      <text class="t-or" x="20" y="190">Ce qui engage la commune</text>
    </g>
  </g>

  <!-- IZAIA -->

  <!-- L'arrete, a droite. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <text class="t-pv" x="208" y="37">Arrêté municipal</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>

    <text class="t-rub doc-l" style="--q:var(--c2-3)" x="208" y="61">VU</text>
    <rect class="surl" style="--q:var(--c3-4)" x="205" y="65" width="142" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-3);--r:.15s" x="208" y="75">Vu le CGCT, art. L. 2213-1</text>
    <g class="ok" style="--q:var(--c3-4);--r:.3s"><circle cx="368" cy="72" r="7"/><path d="M364.6 72.3l2.5 2.5 4.5-5"/></g>
    <rect class="barre doc-b" style="--q:var(--c2-3);--r:.3s" x="208" y="83" width="150" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-3);--r:.45s" x="208" y="104">ARTICLE 1</text>
    <rect class="surl" style="--q:var(--c3-3)" x="205" y="108" width="108" height="14" rx="2"/>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-3);--r:.6s" x="208" y="118">Avenue de la Gare</text>
    <g class="ok" style="--q:var(--c3-3);--r:.3s"><circle cx="368" cy="115" r="7"/><path d="M364.6 115.3l2.5 2.5 4.5-5"/></g>
    <rect class="surl" style="--q:var(--c3-2)" x="205" y="122" width="92" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-3);--r:.75s" x="208" y="132">Du 12 au 16 mai</text>
    <g class="ok" style="--q:var(--c3-2);--r:.3s"><circle cx="368" cy="129" r="7"/><path d="M364.6 129.3l2.5 2.5 4.5-5"/></g>

    <text class="t-rub doc-l" style="--q:var(--c2-4)" x="208" y="153">ARTICLE 2</text>
    <text class="t-doc doc-l" style="--q:var(--c2-4);--r:.15s" x="208" y="167">Circulation alternée</text>
    <rect class="barre doc-b" style="--q:var(--c2-4);--r:.3s" x="208" y="175" width="120" height="3" rx="1.5"/>

    <g class="etq juste" style="--q:var(--c3-5)"><rect x="276" y="188" width="96" height="14" rx="7"/><text x="324" y="197.8" text-anchor="middle">À LA SIGNATURE</text></g>
  </g>
</svg>
