<svg viewBox="0 0 400 225" role="img" aria-label="Animation : aujourd'hui les mêmes questions reçoivent chaque fois une réponse écrite à la main ; demain l'agent IA prépare une réponse tirée du site de la mairie, avec les tarifs, la caution et l'assurance pour la salle des fêtes, l'agent municipal la relit et l'envoie lui-même, et IZAIA aide à choisir l'outil.">
  <!-- Colonne de gauche, une zone par scene. Les instants c<scene>-<n> viennent de la voix. -->
  <g class="z z-1">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">AUJOURD'HUI</text>
    <text class="t-h" x="20" y="54">Les mêmes questions,</text>
    <text class="t-h" x="20" y="73">chaque semaine.</text>
    <text class="t-l surgit" style="--q:var(--c1-1)" x="20" y="148">Les horaires ?</text>
    <text class="t-l surgit" style="--q:var(--c1-2)" x="20" y="163">Les pièces à fournir ?</text>
    <text class="t-l surgit" style="--q:var(--c1-3)" x="20" y="178">La démarche en ligne ?</text>
    <text class="t-clair surgit" style="--q:var(--c1-4)" x="20" y="196">Et la même réponse, à la main</text>
  </g>

  <g class="z z-2">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">DEMAIN</text>
    <text class="t-h" x="20" y="54">L'agent IA prépare</text>
    <text class="t-h" x="20" y="73">une réponse.</text>
    <text class="t-l surgit" style="--q:var(--c2-2)" x="20" y="158"><tspan class="lab">Appui · </tspan>site de la mairie</text>
    <g class="puce surgit" style="--q:var(--c2-1)">
      <rect x="20" y="178" width="70" height="20" rx="10"/>
      <text x="55" y="191.5" text-anchor="middle">Agent IA</text>
    </g>
    <g class="flux" style="--q:var(--c2-1)">
      <circle style="--r:0s" cx="98" cy="188" r="2"/>
      <circle style="--r:.4s" cx="98" cy="188" r="2"/>
      <circle style="--r:.8s" cx="98" cy="188" r="2"/>
    </g>
  </g>

  <!-- Les courriels recus, partages par les scenes 1 et 2. -->
  <g class="z z-onde">
    <path class="env" style="--i:0" d="M20 98h40v28h-40z M20 98l20 15 20-15"/>
    <path class="env" style="--i:1" d="M70 98h40v28h-40z M70 98l20 15 20-15"/>
    <path class="env" style="--i:2" d="M120 98h40v28h-40z M120 98l20 15 20-15"/>
  </g>

  <g class="z z-3">
    <rect class="k-filet" x="20" y="26" width="18" height="1.4"/>
    <text class="t-kick" x="44" y="29.5">CE QUE ÇA CHANGE</text>
    <g class="rang-x" style="--q:var(--c3-1)">
      <text class="t-h" x="20" y="66" textLength="130">Retaper la réponse</text>
      <rect class="barre-x" x="18" y="60.5" width="134" height="1.6"/>
    </g>
    <g class="verif surgit" style="--q:var(--c3-2)">
      <circle cx="30" cy="96" r="10"/><path d="M25 96.5l3.6 3.6 6.6-7.2"/>
      <text class="t-h" x="48" y="101.5">Relire</text>
    </g>
    <text class="t-clair surgit" style="--q:var(--c3-2);--r:.3s" x="48" y="117">et compléter si besoin</text>
    <text class="t-l surgit" style="--q:var(--c3-3)" x="20" y="140">→ Il l'envoie lui-même</text>
    <text class="t-clair surgit" style="--q:var(--c3-4)" x="20" y="154">Aucune réponse ne part sans lui</text>
    <g class="surgit" style="--q:var(--c3-5)">
      <rect class="k-filet" x="20" y="166" width="18" height="1.4"/>
      <text class="t-or" x="20" y="182">Tout ce qu'il faut,</text>
      <text class="t-or" x="20" y="197">dès la première réponse</text>
    </g>
  </g>

  <!-- IZAIA -->

  <!-- La reponse a l'habitant, a droite. -->
  <g class="doc">
    <rect class="feuille" x="196" y="14" width="188" height="197" rx="7"/>
    <text class="t-pv" x="208" y="37">Réponse à un habitant</text>
    <rect class="filet" x="208" y="45" width="164" height="1"/>
    <rect class="caret" x="208" y="55" width="1.5" height="12"/>
    <rect class="manuel" style="--q:.30" x="208" y="59" width="120" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.55" x="208" y="69" width="90" height="3" rx="1.5"/>
    <rect class="manuel" style="--q:.78" x="208" y="79" width="60" height="3" rx="1.5"/>

    <text class="t-rub doc-l" style="--q:var(--c2-1)" x="208" y="61">QUESTION</text>
    <text class="t-doc t-fort doc-l" style="--q:var(--c2-3)" x="208" y="75">Louer la salle des fêtes</text>

    <text class="t-rub doc-l" style="--q:var(--c2-3);--r:.3s" x="208" y="97">LA RÉPONSE DONNE</text>
    <rect class="surl" style="--q:var(--c3-2)" x="205" y="101" width="138" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-4)" x="208" y="111">Les tarifs votés</text>
    <g class="ok" style="--q:var(--c3-2);--r:.4s"><circle cx="368" cy="108" r="7"/><path d="M364.6 108.3l2.5 2.5 4.5-5"/></g>
    <rect class="surl" style="--q:var(--c3-2);--r:.5s" x="205" y="119" width="138" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-5)" x="208" y="129">Le montant de la caution</text>
    <g class="ok" style="--q:var(--c3-2);--r:.9s"><circle cx="368" cy="126" r="7"/><path d="M364.6 126.3l2.5 2.5 4.5-5"/></g>
    <rect class="surl" style="--q:var(--c3-2);--r:1s" x="205" y="137" width="138" height="14" rx="2"/>
    <text class="t-doc doc-l" style="--q:var(--c2-6)" x="208" y="147">L'attestation d'assurance</text>
    <g class="ok" style="--q:var(--c3-2);--r:1.4s"><circle cx="368" cy="144" r="7"/><path d="M364.6 144.3l2.5 2.5 4.5-5"/></g>
    <rect class="barre doc-b" style="--q:var(--c2-6);--r:.3s" x="208" y="160" width="150" height="3" rx="1.5"/>
    <rect class="barre doc-b" style="--q:var(--c2-6);--r:.45s" x="208" y="169" width="100" height="3" rx="1.5"/>

    <g class="etq juste" style="--q:var(--c3-3)"><rect x="296" y="186" width="76" height="14" rx="7"/><text x="334" y="195.8" text-anchor="middle">ENVOYÉE</text></g>
  </g>
</svg>
